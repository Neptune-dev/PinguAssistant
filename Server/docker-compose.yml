services:
  web:
    image: php:8.1.32-apache
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html/
      - ./docker/apache.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/web.entrypoint.sh:/usr/local/bin/entrypoint.sh
    ports:
      - ${WEB_PORT}:80
    environment:
      DB_HOST: db
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PWD}
    depends_on:
      - db
    command: [ "sh", "/usr/local/bin/entrypoint.sh" ]

  db:
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PWD}
    volumes:
      - ./data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d
    ports:
      - ${DB_PORT}:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - ${PHPMYADMIN_PORT}:80
    environment:
      PMA_HOST: db
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PWD}
    depends_on:
      - db  